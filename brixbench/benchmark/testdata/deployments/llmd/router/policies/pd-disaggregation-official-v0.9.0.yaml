## Derived from llm-d v0.9.0 guides/pd-disaggregation/router/pd-disaggregation.values.yaml.
## Token-based P/D routing (approx-prefix-cache-producer, inflight-load-producer,
## prefix-cache-affinity-filter, token-load-scorer). peakPrefillThroughput is the
## official gpt-oss-120b H200 calibration; leave it as the upstream default.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # Single EPP replica: inflight-load-producer token accounting is local to
    # each EPP process. Multiple replicas would under-count per-endpoint load.
    replicas: 1
    pluginsConfigFile: "pd-config.yaml"
    pluginsCustomConfig:
      pd-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: disagg-headers-handler
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciderPluginName: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            maxPrefixTokensToMatch: 131072
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            peakPrefillThroughput: 33821
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        schedulingProfiles:
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker

  modelServers:
    matchLabels:
      llm-d.ai/guide: "pd-disaggregation"
